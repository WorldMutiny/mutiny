<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Only Mutiny's own files run here, and the page can't reach the network:
       all fetching happens in the main process, through checked handlers. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; font-src 'self' data: file:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Mutiny</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Draggable strip so the frameless window can be moved -->
  <div id="dragstrip"></div>

  <!-- ======================= SHELVES ======================= -->
  <div id="bookshelf-view">
    <header id="shelf-header">
      <h1>MUTINY</h1>
      <div class="shelf-header-right">
        <span id="author-chip" data-i18n-title="shelf.authorChipTitle"></span>
        <button id="import-btn" data-i18n="shelf.import" data-i18n-title="shelf.importTitle"></button>
        <button id="add-shelf-btn" data-i18n="shelf.add" data-i18n-title="shelf.addTitle"></button>
      </div>
    </header>
    <div id="shelves"></div>
  </div>

  <!-- ======================= FIRST RUN ======================= -->
  <div id="firstrun" class="modal-backdrop" hidden>
    <div class="modal">
      <!-- step 0 is deliberately bilingual: it's how the language gets chosen -->
      <div id="fr-step0">
        <h2>Mutiny</h2>
        <p>Idioma · Language</p>
        <div class="fr-choices">
          <button class="fr-choice fr-lang" data-lang="es">
            <strong>Español</strong>
            <span>La interfaz y el corrector ortográfico en español.</span>
          </button>
          <button class="fr-choice fr-lang" data-lang="en">
            <strong>English</strong>
            <span>The interface and spellcheck in English.</span>
          </button>
        </div>
      </div>
      <div id="fr-step1" hidden>
        <h2 data-i18n="fr.welcome"></h2>
        <p data-i18n="fr.intro"></p>
        <label><span data-i18n="fr.name"></span> <span class="soft" data-i18n="fr.nameHint"></span>
          <input id="fr-name" type="text" autocomplete="off" spellcheck="false" />
        </label>
        <label><span data-i18n="fr.pen"></span> <span class="soft" data-i18n="fr.penHint"></span>
          <input id="fr-pen" type="text" autocomplete="off" spellcheck="false" />
        </label>
        <div class="fr-style">
          <p data-i18n="fr.styleQ"></p>
          <div class="fr-choices">
            <button class="fr-choice fr-style-pick" data-style="pantser">
              <strong data-i18n="fr.pantser"></strong>
              <span data-i18n="fr.pantserDesc"></span>
            </button>
            <button class="fr-choice fr-style-pick" data-style="plotter">
              <strong data-i18n="fr.plotter"></strong>
              <span data-i18n="fr.plotterDesc"></span>
            </button>
          </div>
        </div>
      </div>
      <div id="fr-step2" hidden>
        <h2 data-i18n="fr.lookTitle"></h2>
        <p data-i18n="fr.lookIntro"></p>
        <div id="fr-sample">
          <p id="fr-sample-text" data-i18n="fr.sample"></p>
        </div>
        <p style="margin-bottom:6px" data-i18n="fr.typeface"></p>
        <div id="fr-bodyfonts" class="fr-fontrow"></div>
        <div style="text-align:right;margin-top:20px">
          <button id="fr-next" class="btn-gold" data-i18n="fr.next"></button>
        </div>
      </div>
      <div id="fr-step3" hidden>
        <h2 data-i18n="fr.aiTitle"></h2>
        <p data-i18n="fr.aiIntro"></p>
        <p class="soft fr-ai-state" style="font-size:13px"></p>
        <div class="fr-choices">
          <button class="fr-choice" id="fr-ai-on">
            <strong data-i18n="fr.aiOn"></strong>
            <span data-i18n="fr.aiOnDesc"></span>
          </button>
          <button class="fr-choice" id="fr-ai-off">
            <strong data-i18n="fr.aiOff"></strong>
            <span data-i18n="fr.aiOffDesc"></span>
          </button>
        </div>
      </div>

      <div id="fr-step4" hidden>
        <h2 data-i18n="fr.voiceTitle"></h2>
        <p data-i18n="fr.voiceIntro"></p>
        <p class="soft fr-voice-state" style="font-size:13px" data-i18n="fr.voiceHint"></p>
        <div class="fr-choices">
          <button class="fr-choice" id="fr-voice-import">
            <strong data-i18n="fr.voiceImport"></strong>
            <span data-i18n="fr.voiceImportDesc"></span>
          </button>
          <button class="fr-choice" id="fr-done">
            <strong data-i18n="fr.voiceDone"></strong>
            <span data-i18n="fr.voiceDoneDesc"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ======================= EDITOR ======================= -->
  <div id="editor-view" hidden>

    <!-- Left hover zone: chapter navigation -->
    <div id="nav-hotzone"></div>
    <!-- the panes' pull tabs: a quiet sign at each edge that a pane is there -->
    <button id="nav-tab" class="edge-tab left" data-i18n-title="edge.navTitle"><span class="et-icon">☰</span></button>
    <button id="side-tab" class="edge-tab right" data-i18n-title="edge.sideTitle"><span class="et-icon">⚑</span><span class="et-count" hidden></span></button>
    <nav id="nav-pane">
      <div id="nav-list"></div>
      <button id="nav-add" data-i18n="nav.add" data-i18n-title="nav.addTitle"></button>
    </nav>

    <!-- Right hover zone: notes & comments -->
    <div id="side-hotzone"></div>
    <aside id="side-pane">
      <div id="side-head">
        <span class="side-tabs">
          <button class="side-tab on" data-view="notes" data-i18n="side.title"></button>
          <button class="side-tab" data-view="chat" data-i18n="chat.tab"></button>
        </span>
        <button id="side-pin" data-i18n-title="side.pinTitle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M9 3h6M10 3v7.2l-3.6 3.1A1 1 0 0 0 7 15h10a1 1 0 0 0 .6-1.7L14 10.2V3"/></svg></button>
      </div>
      <div id="sticky-list"></div>
      <div id="chat-view" hidden>
        <div class="chat-log"></div>
        <div class="chat-status" hidden>
          <span class="ai-spin"></span>
          <span class="cs-text"><span class="cs-stage"></span><span class="cs-who soft"></span></span>
          <span class="cs-time soft"></span>
          <button class="cs-stop btn-quiet" data-i18n="ai.stop"></button>
        </div>
        <div class="chat-compose">
          <div class="chat-sel" hidden><span class="chat-sel-text"></span><button class="chat-sel-x">✕</button></div>
          <textarea class="chat-input" rows="3" spellcheck="false" data-i18n-placeholder="chat.placeholder"></textarea>
          <div class="chat-opts">
            <select class="chat-scope">
              <option value="essay" data-i18n="chat.scopeEssay"></option>
              <option value="section" data-i18n="chat.scopeSection"></option>
            </select>
            <label class="chat-web-wrap"><input type="checkbox" class="chat-web"/> <span data-i18n="chat.web"></span></label>
            <span class="chat-spacer"></span>
            <button class="chat-clear btn-quiet" data-i18n="chat.clear"></button>
            <button class="chat-send btn-gold" data-i18n="chat.send"></button>
          </div>
        </div>
      </div>
    </aside>

    <!-- The manuscript -->
    <main id="paper-scroll">
      <div id="paper">
        <div id="title-page" class="sheet">
          <div id="tp-title" contenteditable="true" spellcheck="false" data-i18n-ph="tp.title"></div>
          <div id="tp-subtitle" contenteditable="true" spellcheck="false" data-i18n-ph="tp.subtitle"></div>
          <div id="tp-author" contenteditable="true" spellcheck="false" data-i18n-ph="tp.author"></div>
        </div>
        <div id="chapters"></div>
      </div>
      <!-- Notes / Outline / Sources / Later live on the same paper, swapped in -->
      <div id="aux-paper" hidden>
        <h2 id="aux-title"></h2>
        <div id="aux-editor" contenteditable="true" spellcheck="false"></div>
        <div id="outline-list" hidden></div>
        <div id="darlings-list" hidden></div>
        <div id="sources-list" hidden></div>
      </div>
      <!-- Reorder: the draft as cards (reorder.js) -->
      <div id="reorder-paper" hidden></div>
    </main>

    <!-- Bottom bar: tabs + counters -->
    <footer id="bottombar">
      <button id="back-to-shelf" data-i18n="bar.shelf" data-i18n-title="bar.shelfTitle"></button>
      <button id="reorder-btn" data-i18n="ro.button" data-i18n-title="ro.buttonTitle"></button>
      <div id="tabs">
        <div class="tab active" data-tab="manuscript" data-i18n="tab.manuscript"></div>
        <div class="tab" data-tab="notes"></div>
        <div class="tab" data-tab="outline"></div>
        <div class="tab" data-tab="sources" data-i18n="tab.sources"></div>
        <div class="tab darlings" data-tab="darlings" data-i18n="tab.darlings" data-i18n-title="tab.darlingsTitle"></div>
      </div>
      <div id="counters">
        <button id="ai-status" hidden data-i18n-title="ai.cancelTitle"><span class="ai-spin"></span><span class="ai-text"></span><span class="ai-x">✕</span></button>
        <span id="goal-counter" data-i18n-title="bar.goalTitle"></span>
        <span id="pos-counter"></span>
        <span id="word-counter" data-i18n-title="bar.wordsTitle"></span>
        <span id="zoom-control" data-i18n-title="bar.zoomTitle"><button id="zoom-out" data-i18n-title="bar.zoomOut">&#8722;</button><span id="zoom-level" data-i18n-title="bar.zoomReset">100%</span><button id="zoom-in" data-i18n-title="bar.zoomIn">+</button></span>
      </div>
    </footer>

    <!-- Find & replace -->
    <div id="searchbar" hidden>
      <input id="search-input" data-i18n-placeholder="search.find" spellcheck="false" />
      <span id="search-count"></span>
      <button id="search-prev" data-i18n-title="search.prev">&#8593;</button>
      <button id="search-next" data-i18n-title="search.next">&#8595;</button>
      <input id="replace-input" data-i18n-placeholder="search.replaceWith" spellcheck="false" />
      <button id="replace-one" data-i18n="search.replace"></button>
      <button id="replace-all" data-i18n="search.all"></button>
      <button id="search-close" data-i18n-title="search.close">&#10005;</button>
    </div>

  </div>

  <!-- Toast — lives at body level so it shows over both views -->
  <div id="hint" hidden></div>

  <script src="i18n.js"></script>
  <script src="covers.js"></script>
  <script src="app.js"></script>
  <script src="ai-ui.js"></script>
  <script src="versions.js"></script>
  <script src="reorder.js"></script>
  <script src="voice.js"></script>
  <script src="appmenu.js"></script>
  <script src="theme.js"></script>
</body>
</html>
