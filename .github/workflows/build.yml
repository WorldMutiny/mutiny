# Builds Mutiny for Linux, Windows and macOS.
#
#   push a tag vX.Y.Z (or vX.Y.Z-beta.N) -> builds all three, checks each one
#                                           boots, and attaches the installers
#                                           to a DRAFT release (you publish it)
#   Actions tab -> "Run workflow"        -> builds all three as downloadable
#                                           artifacts, no release
#
# Builds are unsigned (no Apple or Windows certificates): the README explains
# how to open them the first time. Nothing here needs a secret.

name: Build Mutiny

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          pre=""; [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" --draft $pre --title "Mutiny $GITHUB_REF_NAME" --notes "Draft — see CHANGELOG.md."

  linux:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux AppImage --x64 --arm64 --publish never
      - name: Smoke test — the app boots and creates its library
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          mkdir -p "$HOME/Documents"
          xvfb-run -a dist/linux-unpacked/mutiny --no-sandbox > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 45); do
            lib="$HOME/Documents/Mutiny Library/library.json"; [ -f "$lib" ] || lib=
            [ -n "$lib" ] && { echo "Mutiny booted on Linux ($lib)."; exit 0; }
            sleep 1
          done
          cat "$RUNNER_TEMP/app.log"; echo "Mutiny never created its library"; exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.AppImage
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.AppImage --clobber

  windows:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - name: Smoke test — the app boots and creates its library
        shell: pwsh
        run: |
          $exe = "dist\win-unpacked\Mutiny.exe"
          Start-Process $exe
          $lib = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "Mutiny Library\library.json"
          for ($i = 0; $i -lt 45; $i++) {
            if (Test-Path $lib) { Write-Host "Mutiny booted on Windows."; Get-Process Mutiny -ErrorAction SilentlyContinue | Stop-Process -Force; exit 0 }
            Start-Sleep -Seconds 1
          }
          Write-Error "Mutiny never created its library ($lib)"; exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.exe
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber

  mac:
    needs: [release]
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ad-hoc signed (free): Apple Silicon refuses to run a binary with no
      # signature at all; notarization needs a paid Apple Developer account
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test — the app boots and creates its library
        run: |
          app=$(ls -d dist/mac-arm64/Mutiny.app dist/mac/Mutiny.app 2>/dev/null | head -1)
          "$app/Contents/MacOS/Mutiny" > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 45); do
            [ -f "$HOME/Documents/Mutiny Library/library.json" ] && { echo "Mutiny booted on macOS."; pkill -f "Mutiny.app" || true; exit 0; }
            sleep 1
          done
          cat "$RUNNER_TEMP/app.log"; echo "Mutiny never created its library"; exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/*.dmg
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
